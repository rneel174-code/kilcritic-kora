<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1117"><link rel="manifest" href="/manifest.json"><title>KILCRITIC SUPREME ENGINE</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0d1117;color:#f0f6fc}header{position:sticky;top:0;background:#161b22;padding:15px;border-bottom:1px solid #30363d}main{max-width:1200px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:16px}button,input,select{width:100%;padding:11px;margin:5px 0;border-radius:9px;border:1px solid #30363d;background:#0d1117;color:#f0f6fc}button{cursor:pointer}pre{white-space:pre-wrap;word-break:break-word}.muted{color:#8b949e}</style></head><body><header><b>🧠 KILCRITIC SUPREME ENGINE</b> <span class="muted">V6 AUTOPILOT</span></header><main><div class="card"><h2>Simple Human Control</h2><p class="muted">Set once → Brain plans → Create → Check → Schedule → Publish → Monitor → Learn.</p><select id="audience"><option value="GENERAL">🌍 General / Mixed</option><option value="KIDS">👶 Kids</option><option value="ADULT">🔞 18+</option></select><input id="topic" placeholder="Topic"><select id="ctype"><option>video</option><option>photo</option><option>wallpaper</option><option>story</option></select><button onclick="brain()">🧠 Make Plan</button><pre id="plan"></pre></div><div class="grid"><div class="card"><h3>📱 Platforms</h3><div id="platforms"></div></div><div class="card"><h3>📁 Media Hub</h3><input id="file" type="file"><button onclick="upload()">Upload</button><div id="media"></div></div><div class="card"><h3>📅 30-Day Autopilot</h3><b>Human-busy mode: ON</b><button onclick="auto()">Show Policy</button><pre id="auto"></pre></div><div class="card"><h3>📈 Trend / Competition</h3><button onclick="trend()">Build Analysis Plan</button><pre id="trend"></pre></div><div class="card"><h3>💰 Earning Finder</h3><button onclick="money()">Scan</button><pre id="money"></pre></div><div class="card"><h3>💬 Comments</h3><select id="cmode"><option>MIX</option><option>AUTO</option><option>HUMAN</option></select><button onclick="comments()">Rules</button><pre id="comments"></pre></div><div class="card"><h3>🩺 Health</h3><pre id="health"></pre></div><div class="card"><h3>🧠 Learning</h3><button onclick="learn()">Status</button><pre id="learn"></pre></div></div></main><script>const api=async(u,o)=>{let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d};async function brain(){
const btn=document.querySelector('button[onclick="brain()"]');
const output=document.getElementById('plan');
if(btn){btn.disabled=true;btn.textContent='⏳ Making Plan...'}
output.textContent='Please wait...';
try{
const result=await api('/api/brain/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:document.getElementById('topic').value,audience:document.getElementById('audience').value,content_type:document.getElementById('ctype').value})});
output.textContent=JSON.stringify(result,null,2);
}catch(error){
output.textContent='❌ Make Plan Error:\n'+error.message;
}finally{
if(btn){btn.disabled=false;btn.textContent='🧠 Make Plan'}
}
}async function upload(){let f=file.files[0];if(!f)return;let x=new FormData();x.append('file',f);let d=await api('/api/upload?audience='+audience.value,{method:'POST',body:x});alert('Uploaded: '+d.media_id);load()}async function auto(){document.getElementById('auto').textContent=JSON.stringify(await api('/api/autopilot'),null,2)}async function trend(){document.getElementById('trend').textContent=JSON.stringify(await api('/api/trends',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic.value})}),null,2)}async function money(){document.getElementById('money').textContent=JSON.stringify(await api('/api/monetization'),null,2)}async function comments(){document.getElementById('comments').textContent=JSON.stringify(await api('/api/comments?mode='+cmode.value),null,2)}async function learn(){document.getElementById('learn').textContent=JSON.stringify(await api('/api/learning'),null,2)}async function load(){let[h,m,p]=await Promise.all([api('/api/health'),api('/api/media'),api('/api/platforms')]);health.textContent=JSON.stringify(h,null,2);media.innerHTML=m.items.map(x=>`<div>${x.name} · ${x.kind} · ${x.audience}</div>`).join('')||'No media';platforms.innerHTML=p.items.map(x=>`<div>${x.name}: ${x.connected?'🟢 connected':'⚪ not connected'}</div>`).join('')}load();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></body></html>
